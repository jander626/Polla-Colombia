name: World Cup Forecast Bot

on:
  schedule:
    # Runs every 30 minutes — checks for matches in the 24h window and processes Telegram commands
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (auto / poll / test)"
        required: false
        default: "auto"

permissions:
  contents: write  # needed to commit state.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always fetch the latest state.json from the branch
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py ${{ github.event.inputs.mode || 'auto' }}

      - name: Commit updated state
        run: |
          git config user.name  "forecast-bot[bot]"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add state.json
          # Only commit if state actually changed
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git push origin ${{ github.ref_name }}
