name: Bot de señales de trading

on:
  # GitHub no respeta este cron: pide cada 15 minutos y dispara dos o tres
  # veces al día, a horas impredecibles. Por eso la ventana de escaneo que
  # decide trading/schedule.py es ancha (06:00–09:25 de Nueva York): con una
  # banda de tres horas y media, cualquier disparo que GitHub conceda cae
  # dentro. Con la ventana estrecha anterior hacían falta dos coincidencias
  # afortunadas seguidas, y el 11 de agosto no hubo ninguna.
  #
  # 10:00–14:00 UTC cubre esa ventana en verano (10:00–13:25 UTC) y en
  # invierno (11:00–14:25 UTC).
  schedule:
    - cron: "*/15 10-14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / scan / track / poll / test"
        required: false
        default: "auto"
      force:
        description: "Ignorar la ventana horaria (true/false)"
        required: false
        default: "false"

permissions:
  contents: write  # para commitear trading_state.json

# Dos ejecuciones simultáneas commitearían el estado a la vez y una perdería.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cada escaneo gasta ~141 de las 800 llamadas diarias del plan gratuito.
      # La caché evita volver a descargar el histórico completo en cada
      # ejecución: solo hacen falta las velas nuevas.
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: .cache/market_data
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          args=("$MODE")
          if [ "$FORCE" = "true" ] && { [ "$MODE" = "auto" ] || [ "$MODE" = "scan" ]; }; then
            args+=(--force)
          fi
          python trading_bot.py "${args[@]}"

      - name: Commit state
        if: always()
        run: |
          git config user.name  "trading-bot[bot]"
          git config user.email "trading-bot@users.noreply.github.com"
          git add trading_state.json
          if git diff --cached --quiet; then
            echo "El estado no cambió."
            exit 0
          fi
          git commit -m "chore: actualizar estado del bot [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
